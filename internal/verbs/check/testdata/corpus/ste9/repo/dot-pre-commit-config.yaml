# .pre-commit-config.yaml — fast per-commit gates.
# Stock hygiene hooks from pre-commit-hooks, plus local hooks for the fast
# half of `make check` (lint). The full test suite is intentionally NOT run
# per-commit — it's slow; "run tests before you commit" is a norm, not a
# per-commit enforcement. Run `make test` (or `make check`) before pushing.
#
# A commit-msg hook enforces conventional commits.
#
# Bootstrap once: `make hooks` (installs both the pre-commit and commit-msg
# stages). Run on demand: `pre-commit run --all-files`.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # assets/ is parity-critical (assets/spec/ste9.txt has no trailing
      # newline and must stay byte-exact; the ste-check/ste-lookup fixture
      # and reference files feed the lint-parity oracle diff directly) —
      # excluded so these hygiene hooks never mutate it.
      - id: trailing-whitespace
        exclude: ^assets/
      - id: end-of-file-fixer
        exclude: ^assets/
      - id: check-yaml
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: gofumpt
        name: gofumpt -l
        entry: contrib/check-gofumpt
        language: system
        files: '\.go$'

      - id: golangci-lint
        name: golangci-lint run
        entry: golangci-lint run
        language: system
        pass_filenames: false
        files: '\.go$'

      - id: conventional-commit-msg
        name: conventional commit message
        entry: contrib/check-commit-msg
        language: system
        stages: [commit-msg]
