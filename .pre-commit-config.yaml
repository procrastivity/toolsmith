# .pre-commit-config.yaml — fast per-commit gates for the toolsmith repo
# itself. The skeleton ships its own copy (skeleton/.pre-commit-config.yaml)
# for instantiated tools; the two serve different repos.
#
# Bootstrap once: `make hooks` (installs BOTH the pre-commit and commit-msg
# stages — the contract requires both, see CONTRACT.md C6).

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # skeleton YAML contains toolname placeholders but is valid YAML;
        # no exclusions needed. Workflows under skeleton/.github are
        # checked like any other YAML.
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]

      - id: conventional-commit-msg
        name: conventional commit message
        entry: contrib/check-commit-msg
        language: system
        stages: [commit-msg]
